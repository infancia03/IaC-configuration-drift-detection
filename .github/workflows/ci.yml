name: ci

on:
  pull_request:
    branches:
      - dev_master
  push:
    branches:
      - dev_master
      - feature/**
      - feature_branch/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee /tmp/go-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -c 3500 /tmp/go-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=go test failed::$message"
            exit "$status"
          fi

      - name: Build CLI
        run: go build ./cmd/driftctl
