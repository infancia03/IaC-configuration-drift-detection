name: ci

on:
  pull_request:
    branches:
      - dev_master
  push:
    branches:
      - dev_master
      - feature_branch/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/driftctl
